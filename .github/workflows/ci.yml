name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax-check backend JS files
        working-directory: backend
        run: |
          set -e
          for f in server.js migrate.js list-models.js src/*.js; do
            echo "Checking $f"
            node -c "$f"
          done

      - name: Validate backend package.json
        working-directory: backend
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Syntax-check extension JS files
        working-directory: extension
        run: |
          set -e
          for f in background.js content.js options.js; do
            echo "Checking $f"
            node -c "$f"
          done

      - name: Validate extension manifest.json
        working-directory: extension
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
